<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Chronoglobe</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chronoglobe">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
/*
VOICE: playful explorer's toy, but honest about evidence
IDEA: a cartoon desk globe with a brass time dial underneath
PICTURE: the globe itself, full screen; the time dial always docked below
COLOUR and TYPE: deep space ground, ocean blues, parchment land, coral playhead; Fredoka + Inter
LAYOUT: globe fills screen; dial docked bottom; info as bottom sheet on phones, side panel from 900px
*/
:root{color-scheme:light dark;
--panel:light-dark(#fbf7ee,#141c2b);--ink:light-dark(#1d1a14,#eef1f6);--muted:light-dark(#6b6352,#9aa6ba);
--line:light-dark(#e2d8c2,#28334a);--btn:light-dark(#efe6d2,#1e2940);--acc:#ff6b4a;--sea:#1f5d99}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#globe{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#globe.drag{cursor:grabbing}
button,input,select{font:inherit;color:inherit}
button{background:var(--btn);border:1px solid var(--line);border-radius:12px;min-height:44px;min-width:44px;cursor:pointer;padding:0 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{font:600 22px/1 Fredoka,sans-serif;color:#fff;text-shadow:0 2px 8px #0008;letter-spacing:.2px}
.brand small{display:block;font:400 12px Inter,sans-serif;color:#b8c4d8;margin-top:4px}
.tools{display:flex;gap:8px}
.tools button{background:#141c2bcc;color:#fff;border-color:#ffffff22;backdrop-filter:blur(8px)}
/* time dial */
.dial{position:fixed;left:0;right:0;bottom:0;padding:10px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0006}
.dial-in{max-width:980px;margin:0 auto;display:grid;gap:8px}
.yr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#yearBtn{background:none;border:0;padding:0 4px;font:600 clamp(28px,6vw,40px)/1.05 Fredoka,sans-serif;white-space:nowrap;min-width:0}
#yearBtn span{font-size:.5em;color:var(--muted);margin-left:6px}
.yr-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.seg{display:flex;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{min-height:36px;border:0;background:none;border-radius:9px;font-size:14px;font-weight:600;padding:0 12px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
#status{font-size:13px;color:var(--muted);text-align:right;background:none;border:0;min-height:0;padding:2px 0;text-decoration:underline dotted;text-underline-offset:3px}
.list button{width:100%;text-align:left;margin:0 0 6px;display:flex;gap:10px;align-items:center}
.list .sw{display:inline-block}
.skips{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.skips button{padding:0;font-weight:600;font-size:14px;white-space:nowrap}
#play{background:var(--acc);color:#fff;border-color:transparent;font-size:18px}
.slider{position:relative;height:44px}
#range{width:100%;height:44px;margin:0;appearance:none;-webkit-appearance:none;background:transparent}
#range::-webkit-slider-runnable-track{height:10px;border-radius:8px;background:var(--track)}
#range::-moz-range-track{height:10px;border-radius:8px;background:var(--track)}
#range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 2px 6px #0005}
#range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--acc)}
.ticks{position:relative;height:16px;font-size:12px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
/* sheets */
.sheet{position:fixed;z-index:5;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 40px #0007;padding:16px;overflow:auto;display:none}
.sheet.open{display:block}
.sheet h2{font:600 22px/1.1 Fredoka,sans-serif;margin:0 0 6px;text-wrap:balance}
.sum{font-size:15px;margin:0 0 10px}
.sheet .x{position:absolute;top:8px;right:8px;background:none;border:0;font-size:22px}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--btn);margin-bottom:8px}
.meta{color:var(--muted);font-size:14px;margin:2px 0 10px}
.sheet p{margin:0 0 10px}
.sheet a{color:var(--acc);font-weight:600}
.lyr{display:flex;align-items:center;gap:12px;min-height:44px;border-bottom:1px solid var(--line);cursor:pointer}
.lyr input{width:22px;height:22px;accent-color:var(--acc)}
.sw{width:14px;height:14px;border-radius:50%;flex:none}
.note{font-size:13px;color:var(--muted);margin-top:12px}
#dateForm{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#dateForm input{width:9em;min-height:44px;font-size:16px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--btn)}
#dateForm select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--btn);padding:0 8px;font-size:16px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.quick button{font-size:14px}
#scene3d{position:fixed;inset:0;z-index:40;background:#0b1220;color:#fff}
#scene3d[hidden]{display:none}
#c3d{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.s3top{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;align-items:center}
.s3top button,.s3bot button{background:#141c2bd9;color:#fff;border-color:#ffffff26;backdrop-filter:blur(8px)}
.s3top button[aria-pressed=true]{background:#3aa38a;color:#06140f}
.s3title{flex:1;text-shadow:0 1px 6px #000a;line-height:1.15}.s3title b{font:600 20px Fredoka,sans-serif;display:block}.s3title small{font-size:12px;color:#d7e0ee}
#s3legend{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 54px);right:12px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;background:#141c2bd9;padding:6px 10px;border-radius:10px}
#s3legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
#s3msg{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#141c2be6;padding:14px 18px;border-radius:14px;max-width:min(90vw,420px);text-align:center}
.s3bot{position:absolute;left:0;right:0;bottom:0;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:linear-gradient(#0b122000,#0b1220d9 30%);display:grid;gap:8px}
.s3bot .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.s3bot .chips button{flex:none;font-size:14px}
.s3bot .chips button[aria-pressed=true]{background:#ffd23f;color:#1b1407}
.sunrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sunrow input{flex:1 1 200px;accent-color:#ffd23f;height:44px}
.s3bot .seg{background:#141c2bd9;border-color:#ffffff26}.s3bot .seg button{background:none;border:0;backdrop-filter:none}.s3bot .seg button[aria-pressed=true]{background:#fff;color:#141c2b}
.s3small{margin:0;font-size:13px;color:#d7e0ee}
#s3panel{z-index:45;color:var(--ink)}
#sticks{position:absolute;left:0;right:0;bottom:calc(var(--s3botH,200px) + 6px);display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
#sticks[hidden],#s3legend[hidden],#s3msg[hidden],#actBtns[hidden]{display:none}
#scene3d,#globe,.dial,.top{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#actBtns{position:absolute;right:160px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#actBtns button{border-radius:50%;width:64px;height:64px;padding:0;font-size:13px;font-weight:700;background:#141c2bd9;color:#fff;border:2px solid #ffffff55;touch-action:none}
#actBtns #btnJump{background:#ffd23fe6;color:#1b1407}
@media (max-height:600px){#actBtns{right:130px}}
.stick{width:128px;height:128px;border-radius:50%;background:#ffffff1f;border:2px solid #ffffff55;backdrop-filter:blur(4px);position:relative;touch-action:none;pointer-events:auto}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#ffffffcc;box-shadow:0 2px 8px #0006}
#s3cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0008;pointer-events:none}
#s3cross[hidden]{display:none}
#s3compass{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 54px);background:none;border:0;padding:2px;min-width:44px;min-height:44px}
#s3needle{transition:transform .08s linear}
@media (max-height:600px){.stick{width:104px;height:104px}}
@media (max-width:520px){.s3title small{display:none}.s3title b{font-size:18px}.s3top .tools button{padding:0 10px;font-size:14px}.s3top #s3back{padding:0 10px}}
button.step{background:#ffd23f;color:#1b1407;border-color:transparent;font-weight:700}
@media (max-width:899px){#s3panel{top:calc(max(10px,env(safe-area-inset-top)) + 60px);bottom:auto;max-height:46vh}}
@media (max-width:899px){.sheet{left:8px;right:8px;bottom:calc(var(--dialH,180px) + 8px);max-height:48vh;border-radius:18px}}
@media (min-width:900px){.sheet{top:76px;right:16px;width:360px;max-height:calc(100vh - var(--dialH,180px) - 100px);border-radius:18px}}
@media (max-width:420px){.skips button{font-size:12px}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="globe" aria-label="Interactive globe. Drag to spin, pinch or scroll to zoom, tap a place for details."></canvas>

<div class="top">
  <div class="brand">Chronoglobe<small>Drag to spin · tap a place</small></div>
  <div class="tools">
    <button id="homeBtn" aria-label="Reset view" title="Reset view (H)">⌂</button>
    <button id="searchBtn" aria-label="Search" title="Search (/)">Search</button>
    <button id="layersBtn" aria-label="Layers" title="Layers (L)">Layers</button>
  </div>
</div>

<section class="sheet" id="info" aria-live="polite"><button class="x" data-close="info" aria-label="Close">×</button><div id="infoBody"></div></section>

<section class="sheet" id="layers">
  <button class="x" data-close="layers" aria-label="Close">×</button>
  <h2>Layers</h2>
  <div id="layerList"></div>
  <p class="note" id="dataNote"></p>
  <label class="lyr" style="border:0"><span>Load a borders file (.geojson)</span><input type="file" id="fileIn" accept=".geojson,.json,application/geo+json,application/json" style="width:auto;height:auto"></label>
</section>

<section class="sheet" id="moment"><button class="x" data-close="moment" aria-label="Close">×</button><div id="momentBody"></div></section>

<section class="sheet" id="searchSheet">
  <button class="x" data-close="searchSheet" aria-label="Close">×</button>
  <h2>Search</h2>
  <input id="searchIn" type="search" placeholder="Person, event, route, period…" aria-label="Search" autocomplete="off" style="width:100%;min-height:44px;font-size:16px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--btn);margin:6px 0 10px">
  <div class="list" id="searchOut"></div>
</section>

<section class="sheet" id="dateSheet">
  <button class="x" data-close="dateSheet" aria-label="Close">×</button>
  <h2>Go to a date</h2>
  <form id="dateForm">
    <input id="dateNum" type="number" inputmode="decimal" min="0" step="any" placeholder="Year" aria-label="Year">
    <span id="dateUnit" class="meta" style="align-self:center;margin:0"></span>
    <select id="dateEra" aria-label="Era"><option>CE</option><option>BCE</option></select>
    <button type="submit">Go</button>
  </form>
  <div class="quick" id="quick"></div>
</section>

<footer class="dial" id="dial">
  <div class="dial-in">
    <div class="yr-row">
      <button id="yearBtn" aria-label="Change date">1066</button>
      <div class="yr-side">
        <div class="seg" role="group" aria-label="Timeline"><button id="modeH" aria-pressed="true">Human history</button><button id="modeD" aria-pressed="false">Deep time</button></div>
        <button id="status">Loading…</button>
      </div>
    </div>
    <div class="skips">
      <button data-step="-1000" aria-label="Back 1000 years">−1k</button>
      <button data-step="-100" aria-label="Back 100 years">−100</button>
      <button data-step="-10" aria-label="Back 10 years">−10</button>
      <button data-step="-1" aria-label="Back 1 year">−1</button>
      <button id="play" aria-label="Play">▶</button>
      <button data-step="1" aria-label="Forward 1 year">+1</button>
      <button data-step="10" aria-label="Forward 10 years">+10</button>
      <button data-step="100" aria-label="Forward 100 years">+100</button>
      <button data-step="1000" aria-label="Forward 1000 years">+1k</button>
    </div>
    <div class="slider"><input type="range" id="range" min="0" max="1000" step="1" aria-label="Timeline"></div>
    <div class="ticks" id="ticks"></div>
  </div>
</footer>

<div id="scene3d" hidden>
  <canvas id="c3d" aria-label="3D reconstruction. Drag to look around, tap a stone for details."></canvas>
  <div class="s3top">
    <button id="s3back">← Globe</button>
    <div class="s3title"><b id="s3name"></b><small id="s3when"></small></div>
    <div class="tools"><button id="s3ev" aria-pressed="false">Evidence</button><button id="s3srcBtn">Sources</button></div>
  </div>
  <div id="s3legend" hidden><span><i style="background:#3aa38a"></i>High</span><span><i style="background:#e9c46a"></i>Medium</span><span><i style="background:#ff6b4a"></i>Low (conjecture)</span></div>
  <div id="s3msg" hidden></div>
  <div id="s3cross" hidden></div>
  <button id="s3compass" aria-label="Compass: tap to face north" title="Face north"><svg viewBox="-20 -20 40 40" width="40" height="40"><g id="s3needle"><circle r="17" fill="#141c2bd9" stroke="#ffffff55"/><path d="M0 -14 L4.5 0 L0 -2.5 L-4.5 0Z" fill="#ff6b4a"/><path d="M0 14 L4.5 0 L0 2.5 L-4.5 0Z" fill="#d7e0ee"/><text y="-6" x="7" font-size="7" fill="#fff" font-family="Inter,sans-serif" font-weight="700">N</text></g></svg></button>
  <div id="sticks" hidden><div class="stick" id="stL" aria-label="Move stick"><div class="knob"></div></div><div class="stick" id="stR" aria-label="Look stick"><div class="knob"></div></div><div id="actBtns" hidden><button id="btnJump">Jump</button><button id="btnExam">Examine</button></div></div>
  <section id="s3panel" class="sheet"><button class="x" id="s3x" aria-label="Close">×</button><div id="s3body"></div></section>
  <div class="s3bot">
    <div class="chips" id="s3views" role="group" aria-label="Viewpoints"></div>
    <div class="sunrow">
      <div class="seg" role="group" aria-label="Day of year"><button data-decl="24" aria-pressed="true">Midsummer</button><button data-decl="0" aria-pressed="false">Equinox</button><button data-decl="-24" aria-pressed="false">Midwinter</button></div>
      <input type="range" id="s3hour" min="0" max="24" step="0.05" aria-label="Time of day">
    </div>
    <div class="chips" id="s3presets"></div>
    <p id="s3time" class="s3small"></p><p id="s3hint" class="s3small"></p>
  </div>
</div>

<script>window.echarts={registerMap:function(n,g){window.__worldGeo=g}};</script>
<script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/world.js"></script>

SCENES.stonehenge.sources = `<p><strong>Phase shown</strong>: Stage 2, the sarsen phase, about 2620–2480 BCE (Darvill, Marshall, Parker Pearson &amp; Wainwright 2012, <em>Stonehenge remodelled</em>, Antiquity).</p>

  <p><strong>Bluestones</strong>: a double arc (the "Q and R holes" idea); debated.</p>
  <p><strong>Sun</strong>: calculated for this latitude with the Earth’s tilt in 2500 BCE (about 24°). Times are local solar time.</p>
  <p><strong>Not modelled yet</strong>: the Avenue (built a little later), Durrington Walls and the wider landscape, real scanned textures.</p>`;
function buildStonehenge(sc) {
  const {T, rnd, mat, vary, add, stoneGeo, ground, person} = kit(sc);

    return {h: d < 75 ? 0 : (Math.sin(x * 0.012) * 3 + Math.cos(z * 0.009 + 1) * 4 + Math.sin((x + z) * 0.004) * 6) * Math.min(1, (d - 75) / 120)}; }, 'grass');
  const sarsen = () => mat(vary('#c4bdab'), {tex: 'stone'});
  const place = (m, az, r) => { const [x, z] = azDir(az, r); m.position.set(x, 0, z); m.rotation.y = Math.atan2(x, z); return m; };

    const l = place(new T.Mesh(stoneGeo(len, 0.8, 1.0, 1, 0.08, 0), sarsen()), AXIS + 12 + i * 12, R); l.position.y = 4.12; add(l, 'sarsen', 'high'); }

    const grp = place(new T.Group(), AXIS + 180 + Math.atan2(v, u) * 180 / Math.PI, Math.hypot(u, v)); sc.add(grp);
    for (const side of [-1, 1]) { const m = new T.Mesh(stoneGeo(2.0, h, 1.25, 0.82, 0.2, 1.8), sarsen()); m.position.x = side * 1.15; add(m, 'trilithon', 'high', grp); }
    const lt = new T.Mesh(stoneGeo(4.7, 1.0, 1.2, 1, 0.1, 0), sarsen()); lt.position.y = h * 0.95; add(lt, 'trilithon', 'high', grp); }

  add(place(new T.Mesh(stoneGeo(1.0, 4.0, 0.5, 0.9, 0.06, 0.8), mat('#9b8a76')), AXIS + 180, 4.6), 'altar', 'low');

  for (const [a, c] of [[16.5, 40], [16.5, -40], [-16.5, 40], [-16.5, -40]]) add(place(new T.Mesh(stoneGeo(1.2, 2.3, 0.9, 0.75, 0.25, 0.8), sarsen()), AXIS + Math.atan2(c, a) * 180 / Math.PI, Math.hypot(a, c)), 'station', 'med');
  const pit = mat('#e8e4d6');

  const prof = [[45, 0], [47, 1.1], [50, 1.6], [53, 0.7], [54, 0], [54.6, -1.2], [56.4, -1.4], [57.4, -0.3], [58.5, 0.35], [60, 0]].map(([x, y]) => new T.Vector2(x, y));

}

    let h = x < 300 ? 4 : x < 420 ? lerp(4, -2, (x - 300) / 120) : lerp(-2, -12, (x - 420) / 340);

  const sea = new T.Mesh(new T.PlaneGeometry(40000, 60000), mat('#3f7fa0', {roughness: 0.2, flatShading: false, tex: 'water', rep: 300})); sea.rotation.x = -Math.PI / 2; sea.position.set(-2000 - 20000, 0.3, 0); add(sea, 'sea', 'med').castShadow = false;

SCENES.tenochtitlan.sources = `<p><strong>Date shown</strong>: November 1519, when Hernán Cortés and his allies entered the city. It was besieged and largely destroyed in 1521.</p>
  <p><strong>Main sources</strong>: Spanish accounts (Cortés’s letters, Bernal Díaz del Castillo), the 1524 Nuremberg map, codices, and excavations of the Templo Mayor Project (from 1978) and the Programa de Arqueología Urbana.</p>
  <p><strong>Simplified</strong>: island outline, house grid and canals; the city’s orientation is set to the compass. Sizes of the precinct and pyramid follow common estimates for 1519, which vary.</p>`;
function buildTenochtitlan(sc) {
  const {T, rnd, mat, vary, add, ground, roof, person, instanced} = kit(sc);
  ground(160000, 200, '#6d7f4a', '#7f8f55', (x, z) => { const d = Math.hypot(x / 1.2, z); if (d < 12000) return {h: -3, c: '#6a7f6a'}; return {h: Math.min(900, (d - 12000) * 0.09) + (Math.sin(x * 0.0007) * 80 + Math.cos(z * 0.0009) * 90) * Math.min(1, (d - 12000) / 4000)}; }, 'grass');
  const water = mat('#4b8a8a', {roughness: 0.2, flatShading: false, tex: 'water', rep: 260});
  const lake = new T.Mesh(new T.PlaneGeometry(34000, 30000), water); lake.rotation.x = -Math.PI / 2; lake.position.set(0, 0, -1000); add(lake, 'lake', 'high').castShadow = false;
  // island (solid core) and chinampa ring
  const CX = -100, CZ = -700, IA = 1700, IB = 2400, wob = t => 1 + 0.05 * Math.sin(t * 5) + 0.03 * Math.cos(t * 9);

  const sh = new T.Shape(); for (let i = 0; i <= 96; i++) { const t = i / 96 * Math.PI * 2, k = 0.82 * wob(t), x = CX + IA * k * Math.cos(t), z = CZ + IB * k * Math.sin(t); i ? sh.lineTo(x, -z) : sh.moveTo(x, -z); }
  const ig = new T.ShapeGeometry(sh); ig.rotateX(-Math.PI / 2); const isl = new T.Mesh(ig, mat('#b3a684', {tex: 'sand', rep: 0.04})); isl.position.y = 0.5; add(isl, 'island', 'med').castShadow = false;
  const onCause = (x, z) => (Math.abs(x) < 6 && (z > 0 || z < -3000)) || (Math.abs(z - (x < 0 ? x * 0.06 : 0)) < 6 && x < -190);
  S3.groundAt = (x, z) => onCause(x, z) && !inIsl(x, z) ? 1.6 : inIsl(x, z) ? 0.5 : inIsl(x, z, 1.1) ? 0.4 : -0.5;

function more(k) {
  const {T, mat, add, roof, instanced} = k, o = new T.Object3D();
  const M = m => typeof m === 'string' ? mat(m) : m;
  const box = (x, y, z, w, h, d, m, info, cert, ry = 0, parent) => { const b = new T.Mesh(new T.BoxGeometry(w, h, d), M(m)); b.position.set(x, y + h / 2, z); b.rotation.y = ry; return add(b, info, cert, parent); };
  const water = (x0, x1, z0, z1, y = 0.05, info = 'water') => { const m = new T.Mesh(new T.PlaneGeometry(x1 - x0, z1 - z0), mat('#3f7f95', {roughness: 0.2, flatShading: false, tex: 'water', rep: Math.max(4, Math.round((x1 - x0) / 25))}));
    m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); add(m, info, 'med').castShadow = false; return m; };
  const seg = (x0, z0, x1, z1, y, h, th, m, info, cert) => { const L = Math.hypot(x1 - x0, z1 - z0), b = new T.Mesh(new T.BoxGeometry(L + th * 0.6, h, th), M(m));
    b.position.set((x0 + x1) / 2, y + h / 2, (z0 + z1) / 2); b.rotation.y = -Math.atan2(z1 - z0, x1 - x0); return add(b, info, cert); };
  const wallPoly = (pts, h, th, m, info, cert, tw) => { for (let i = 0; i < pts.length - 1; i++) { seg(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], 0, h, th, m, info, cert);
      if (tw) box(pts[i][0], 0, pts[i][1], tw, h * 1.4, tw, m, info, cert); } };
  const hill = (x, z, cx, cz, r, h) => { const d = Math.hypot(x - cx, z - cz), t = Math.max(0, Math.min(1, (r - d) / (r * 0.45))); return h * t * t * (3 - 2 * t); };
  // classical temple: front faces local -z; ry turns it
  function temple(p) { const g = new T.Group(); g.position.set(p.x, p.y || 0, p.z); g.rotation.y = p.ry || 0; S3.scene.add(g);
    const W = p.w, D = p.d, ch = p.colH, pod = p.pod ?? 1.5, col = p.color || '#ece6da', mm = mat(col, {tex: 'blocks', rep: 2}), info = p.info, cert = p.cert || 'high';
    if (p.round) { const pg = new T.Mesh(new T.CylinderGeometry(W / 2 + 1, W / 2 + 1.4, pod, 28), mm); pg.position.y = pod / 2; add(pg, info, cert, g); }
    else box(0, 0, 0, W + 2.5, pod, D + 2.5, mm, info, cert, 0, g);
    if (p.steps) box(0, 0, -(D / 2 + 1.25 + p.steps / 2), W * 0.7, pod * 0.75, p.steps, mm, info, 'med', 0, g);
    const r0 = p.colR || ch * 0.075, cg = new T.CylinderGeometry(r0, r0 * 1.12, ch, 12); cg.translate(0, ch / 2, 0); const MM = [];
    const [nf, ns] = p.cols, px = W / 2 - r0 * 1.6, pz = D / 2 - r0 * 1.6;
    if (p.round) for (let i = 0; i < nf; i++) { const a = i / nf * Math.PI * 2; o.position.set(Math.cos(a) * px, pod, Math.sin(a) * px); o.updateMatrix(); MM.push(o.matrix.clone()); }
    else { for (let i = 0; i < nf; i++) { const x = -px + 2 * px * i / (nf - 1); for (const z of p.prostyle ? [-pz] : [-pz, pz]) { o.position.set(x, pod, z); o.updateMatrix(); MM.push(o.matrix.clone()); } }
      if (!p.prostyle) for (let j = 1; j < ns - 1; j++) { const z = -pz + 2 * pz * j / (ns - 1); for (const x of [-px, px]) { o.position.set(x, pod, z); o.updateMatrix(); MM.push(o.matrix.clone()); } } }
    const im = new T.InstancedMesh(cg, mat(col), MM.length); MM.forEach((m, i) => im.setMatrixAt(i, m)); im.castShadow = im.receiveShadow = true; im.userData = {info, cert}; g.add(im); S3.pick.push(im);
    const top = pod + ch;
    if (p.round) { const ce = new T.Mesh(new T.CylinderGeometry(px * 0.72, px * 0.72, ch, 24), mm); ce.position.y = pod + ch / 2; add(ce, info, 'med', g);
      const en = new T.Mesh(new T.CylinderGeometry(px + r0 * 1.5, px + r0 * 1.5, ch * 0.15, 28), mm); en.position.y = top + ch * 0.075; add(en, info, 'med', g);
      const rf = new T.Mesh(new T.ConeGeometry(px + r0 * 1.8, ch * 0.5, 28), mat(p.roofColor || '#a85a3c', {tex: 'thatch', rep: 2})); rf.position.y = top + ch * 0.15 + ch * 0.25; add(rf, info, 'low', g); return g; }
    box(0, pod, p.prostyle ? D * 0.12 : D * 0.04, W * (p.prostyle ? 0.98 : 0.64), ch, D * (p.prostyle ? 0.74 : 0.74), mm, info, 'med', 0, g);
    box(0, top, 0, W, ch * 0.2, D, mm, info, 'med', 0, g);
    const rf = new T.Mesh(roof(D + 0.6, W + 0.6, W * 0.17), mat(p.roofColor || '#a85a3c', {tex: 'thatch', rep: 2})); rf.rotation.y = Math.PI / 2; rf.position.y = top + ch * 0.2; add(rf, info, 'med', g);
    return g; }
  // instanced houses with roofs: pts = [[x, z, w, d, h, ry]]
  function houses(pts, wallC, roofC, roofKind, info, cert, wallTex = 'stone') { const hb = new T.BoxGeometry(1, 1, 1); hb.translate(0, 0.5, 0); const B2 = [], R2 = [];
    let rg = null; if (roofKind === 'pitch') { rg = roof(1, 1, 1); } else if (roofKind === 'hip') { rg = new T.ConeGeometry(Math.SQRT1_2, 1, 4, 1); rg.rotateY(Math.PI / 4); rg.translate(0, 0.5, 0); }
    for (const [x, z, w, d, h, ry = 0, rh = 0.45, y0 = 0] of pts) { o.position.set(x, y0, z); o.rotation.set(0, ry, 0); o.scale.set(w, h, d); o.updateMatrix(); B2.push(o.matrix.clone());
      if (rg) { o.position.y = y0 + h; o.scale.set(roofKind === 'pitch' ? w * 1.06 : w * 1.06, w * rh, roofKind === 'pitch' ? d * 1.1 : d * 1.06); o.updateMatrix(); R2.push(o.matrix.clone()); } }
    instanced(hb, mat(wallC, {tex: wallTex, rep: 1}), B2, info, cert); if (rg) instanced(rg, mat(roofC, {tex: 'thatch', rep: 2}), R2, info, cert); }
  function palms(pts, info = 'tree') { const tr = new T.CylinderGeometry(0.25, 0.4, 12, 5); tr.translate(0, 6, 0); const cr = new T.IcosahedronGeometry(3.2, 0); cr.scale(1, 0.45, 1); cr.translate(0, 12, 0); const MM = [];
    for (const [x, z, s2] of pts) { o.position.set(x, S3.groundAt ? S3.groundAt(x, z) : 0, z); o.rotation.set(0, x * 0.3, 0); o.scale.set(s2 || 1, s2 || 1, s2 || 1); o.updateMatrix(); MM.push(o.matrix.clone()); }
    instanced(tr, mat('#7a5a3a'), MM, info, 'low'); instanced(cr, mat('#4f7a2e'), MM, info, 'low'); o.scale.set(1, 1, 1); }
  return {box, water, seg, wallPoly, hill, temple, houses, palms, o};
}

  X.box(-430, 0, -470, 120, 8, 14, mat('#e2d9c6', {tex: 'blocks', rep: 3}), 'agora', 'med'); X.box(-330, 0, -380, 14, 8, 110, mat('#e2d9c6', {tex: 'blocks', rep: 3}), 'agora', 'med');

SCENES.london.sources = `<p><strong>Date shown</strong>: about 1400, the time of Geoffrey Chaucer and Richard II.</p>

function buildLondon(sc) {
  const k = kit(sc), {T, rnd, mat, add, ground, roof, person} = k, X = more(k);
  const riverZ = x => 320 + Math.sin(x * 0.0012) * 30;

  // St Paul's
  const stone = mat('#a9a08f', {tex: 'blocks', rep: 3}), lead = mat('#6e7378', {roughness: 0.6});

  const nr = new T.Mesh(roof(170, 17, 10), lead); nr.position.set(-15, 32, 0); add(nr, 'stpauls', 'high');

NEW8.constantinople.sources = `<p><strong>Date shown</strong>: about 560 CE, near the end of Justinian’s reign; the dome is shown as rebuilt in 562.</p><p><strong>Main sources</strong>: the surviving Hagia Sophia and Hagia Irene, Procopius’s <em>Buildings</em>, excavations of the Hippodrome and Great Palace, and studies such as the Byzantium 1200 project.</p><p><strong>Simplified</strong>: the shoreline, palace layout and streets.</p>`;

  for (const [z, h] of [[300, 25], [340, 8], [380, 32]]) { const ob = new T.Mesh(new T.CylinderGeometry(0.9, 1.4, h, 4), mat(z === 340 ? '#8a6a3a' : '#c9b08a')); ob.position.set(-250, hy + 1.6 + h / 2, z); add(ob, 'hippodrome', 'high'); }
  for (const [x, z, w, d, h] of [[60, 380, 160, 100, 14], [140, 480, 120, 80, 10], [-20, 470, 90, 70, 12], [80, 280, 70, 40, 16]]) X.box(x, gy(x, z), z, w, h, d, mat('#dbc3a0', {tex: 'blocks', rep: 3}), 'palace', 'low');
  const cy = gy(-80, 120); const cl = new T.Mesh(new T.CylinderGeometry(2, 2.4, 40, 12), mat('#d9cfbb')); cl.position.set(-80, cy + 20, 120); add(cl, 'column', 'med');
  const hs = new T.Mesh(new T.BoxGeometry(2, 4, 6), mat('#8a6a3a', {metalness: 0.6, roughness: 0.4})); hs.position.set(-80, cy + 42, 120); add(hs, 'column', 'low');
  const coast = []; for (let x = -2500; x <= 820; x += 120) coast.push([x, 600 + Math.sin(x * 0.002) * 60]); X.wallPoly(coast, 10, 4, mat('#c9b38f', {tex: 'blocks', rep: 1}), 'walls', 'med', 7);

  { const [cx, cz] = P(230, 760); for (const [u, v, w, d] of [[0, -190, 400, 25], [0, 190, 400, 25], [-190, 0, 25, 400], [190, 0, 25, 400]]) { const [x, z] = P(230 + u, 760 + v); Y2.frustum(x, z, 0, w, d, 7, 0.8, plaster, 'ciudadela', 'high', th); }
    const [x, z] = P(300, 760); Y2.stepped(x, z, 0, [[65, 65, 5, 0.9], [57, 57, 5, 0.9], [49, 49, 5, 0.9], [41, 41, 5, 0.9], [33, 33, 4, 0.9]], mat('#9aa4a6', {tex: 'blocks', rep: 2}), 'ciudadela', 'high', th); }
  for (let i = 0; i < 12; i++) { const [x, z] = P(i % 2 ? 45 : -45, -800 + i * 110); Y2.stepped(x, z, 0, [[30, 30, 5, 0.85], [22, 22, 4, 0.85]], plaster, 'avenue', 'high', th); }
  const H = []; for (let u = -2000; u < 2000; u += 57) for (let v = -1300; v < 1800; v += 57) { if (Math.abs(u) < 70 || (u > 30 && u < 300 && v > -230 && v < 30) || (Math.abs(u) < 100 && v > -1060 && v < -860) || (u > 0 && u < 450 && v > 540 && v < 980) || (u < -20 && u > -470 && v > 560 && v < 960) || rnd() < 0.35 || Math.hypot(u, v) > 2100) continue;

  [[0, 500], [3, 505], [20, -100], [0, -920], [120, 700], [-10, 300]].forEach(([u, v], i) => { const [x, z] = P(u, v); person(x, z, i); });

NEW8.zimbabwe.sources = `<p><strong>Date shown</strong>: about 1350 CE, at the height of the trading state that exported gold and imported Chinese porcelain and Persian glass via the Swahili coast.</p><p><strong>Main sources</strong>: Gertrude Caton-Thompson’s excavations (1929), which established its African origin against colonial myths, and later work by Peter Garlake, Innocent Pikirayi and Shadreck Chirikure.</p><p><strong>Simplified</strong>: the irregular wall lines, hill walls, the valley enclosures and houses.</p>`;
function buildZimbabwe(sc) {
  const k = kit(sc), {T, rnd, mat, add, ground, ellipRing, instanced, person} = k, X = more(k);
  ground(9000, 220, '#8f8f55', '#9d9a62', (x, z) => ({h: X.hill(x, z, 0, -680, 260, 80) + X.hill(x, z, -900, 500, 400, 60)}), 'grass');
  const granite = mat('#9a9184', {tex: 'blocks', rep: 2, side: T.DoubleSide});
  const gapT = -Math.PI / 2;
  add(new T.Mesh(ellipRing([[46, 36, 0], [45, 35.3, 11], [43.6, 34, 11], [40, 30, 0]], 120, gapT + 0.12, gapT + Math.PI * 2 - 0.12), granite), 'enclosure', 'high');
  add(new T.Mesh(ellipRing([[44.8, 35.1, 9.6], [44.9, 35.2, 10.4]], 160, gapT + 0.12, gapT + Math.PI * 2 - 0.12), mat('#7f776a', {tex: 'blocks', rep: 3, side: T.DoubleSide})), 'enclosure', 'high');
  add(new T.Mesh(ellipRing([[37, 27, 0], [36.6, 26.6, 8], [35.4, 25.4, 8], [35, 25, 0]], 60, -0.4, 1.1), granite), 'passage', 'high');
  const tw = new T.Mesh(new T.CylinderGeometry(1.4, 2.8, 9, 24), mat('#a39a8c', {tex: 'blocks', rep: 1})); tw.position.set(26, 4.5, 8); add(tw, 'tower', 'high');
  const bg = new T.IcosahedronGeometry(1, 1), BM = []; for (let i = 0; i < 160; i++) { const a = rnd() * Math.PI * 2, d = rnd() * 180, x = Math.cos(a) * d, z = -680 + Math.sin(a) * d * 0.7, s = 4 + rnd() * 12;
    X.o.position.set(x, S3.groundAt(x, z) + s * 0.3, z); X.o.rotation.set(rnd(), rnd(), rnd()); X.o.scale.set(s * 1.3, s * 0.8, s); X.o.updateMatrix(); BM.push(X.o.matrix.clone()); }
  instanced(bg, mat('#8d8578'), BM, 'boulder', 'high'); X.o.rotation.set(0, 0, 0);
  const hw = []; for (let i = 0; i <= 30; i++) { const t = i / 30 * Math.PI * 2; const x = Math.cos(t) * 110, z = -680 + Math.sin(t) * 70; hw.push([x, z]); }
  for (let i = 0; i < 30; i++) { const [x0, z0] = hw[i], [x1, z1] = hw[i + 1]; const w = X.seg(x0, z0, x1, z1, S3.groundAt(x0, z0) - 1, 6, 3.5, granite, 'hill', 'high'); }
  for (let i = 0; i < 6; i++) { const x = -60 + i * 22, z = -660, y = S3.groundAt(x, z); X.box(x, y, z, 0.6, 2, 0.6, '#7f776a', 'birds', 'med'); const b = new T.Mesh(new T.ConeGeometry(0.35, 1.2, 6), mat('#6e7a5e')); b.rotation.z = Math.PI / 2; b.position.set(x, y + 2.4, z); add(b, 'birds', 'med'); }
  const hutG = new T.CylinderGeometry(3, 3.2, 2.6, 14); hutG.translate(0, 1.3, 0); const roofG = new T.ConeGeometry(4.2, 3.6, 14); roofG.translate(0, 4.4, 0); const HM = [];

  for (let i = 0; i < 520; i++) { const x = -500 + rnd() * 1000, z = -450 + rnd() * 800; if (Math.hypot(x / 52, z / 42) < 1 || Math.hypot(x, (z + 680) / 0.7) < 200 || rnd() < 0.2) continue; hut(x, z); }

NEW8.kyoto.sources = `<p><strong>Date shown</strong>: about 1000 CE, the time of Murasaki Shikibu and Sei Shōnagon.</p><p><strong>Main sources</strong>: Heian-period documents and plans (such as the Engi-shiki), excavations by Kyoto City, and Heian Shrine’s reduced copy of the Daigokuden.</p><p><strong>Simplified</strong>: the grid (blocks are drawn coarsely), buildings, colours and gardens.</p>`;
function buildKyoto(sc) {
  const k = kit(sc), {T, rnd, mat, add, ground, person} = k, X = more(k), Y2 = more2(k, X);
  ground(26000, 240, '#7a8f52', '#86995d', (x, z) => ({h: Math.max(0, (-1800 - z) * 0.25, (Math.abs(x) - 3000) * 0.3) + (Math.max(0, -1800 - z, Math.abs(x) - 3000) > 0 ? Math.sin(x * 0.002) * 40 : 0)}), 'grass');

  X.box(0, 11, 3900, 28, 6, 7, mat('#c0392b', {tex: 'wood', rep: 1}), 'rashomon', 'low');
  Y2.pagoda(-300, 3700, 5, 12, 10, '#c0392b', '#4a4a4a', 'toji', 'med'); Y2.hall(-360, 3640, 0, 36, 18, 10, '#c0392b', '#4a4a4a', 'toji', 'med', 0, 1);
  const H = []; for (let x = -2200; x < 2200; x += 120) for (let z = -1700; z < 3950; z += 120) { if (Math.abs(x) < 120 || (Math.abs(x) < 660 && z < 60) || (Math.abs(x + 330) < 120 && Math.abs(z - 3670) < 120)) continue; if (x < 0 && rnd() < 0.45) continue;
    for (let j = 0; j < 2; j++) { const xx = x + 20 + rnd() * 70, zz = z + 20 + rnd() * 70; H.push([xx, zz, 14 + rnd() * 10, 10 + rnd() * 8, 4 + rnd() * 2, 0, 0.45]); } }
  X.houses(H, '#d9c9a2', '#5a5048', 'hip', 'house', 'low', 'wood');
  [[0, 3960], [3, 3955], [0, 600], [5, 620], [0, -320], [-300, 3500]].forEach(([x, z], i) => person(x, z, i));
}

// ---- Chang'an ----
NEW8.changan.info = {

  smallgoose: {t: 'Small Wild Goose Pagoda', cert: 'high', d: 'Built in 707–709; it still stands, though an earthquake took off its top.'},

NEW8.changan.sources = `<p><strong>Date shown</strong>: about 750 CE, under Emperor Xuanzong, just before the An Lushan rebellion.</p><p><strong>Main sources</strong>: Tang texts such as the <em>Chang’an zhi</em>, excavations of the walls, Daming Palace and the markets, and the surviving pagodas.</p><p><strong>Simplified</strong>: the ward grid (drawn evenly), buildings inside wards, and palace layouts.</p>`;
function buildChangan(sc) {
  const k = kit(sc), {T, rnd, mat, add, ground, instanced, person} = k, X = more(k), Y2 = more2(k, X);
  ground(50000, 240, '#9a9a68', '#a7a476', (x, z) => ({h: z > 9000 ? Math.min(1200, (z - 9000) * 0.25) : 0}), 'grass');
  const earth = mat('#b59b72', {tex: 'blocks', rep: 4});
  X.wallPoly([[-4860, -3000], [4860, -3000], [4860, 5650], [-4860, 5650], [-4860, -3000]], 6, 9, earth, 'walls', 'high', 14);
  { const av = new T.Mesh(new T.BoxGeometry(150, 0.2, 5650), mat('#cbbc96', {tex: 'sand', rep: 40})); av.position.set(0, 0.1, 2825); add(av, 'zhuque', 'high').castShadow = false; }
  X.wallPoly([[-1400, -3000], [1400, -3000], [1400, 0], [-1400, 0], [-1400, -3000]], 7, 6, earth, 'palace', 'med', 0);
  Y2.hall(0, -2300, 0, 60, 26, 14, '#b8452f', '#3f4a4a', 'palace', 'med', 0, 6); Y2.hall(0, 0, 0, 40, 14, 12, '#b8452f', '#3f4a4a', 'palace', 'med', 0, 4);
  X.wallPoly([[1800, -5600], [3600, -5600], [3600, -3000], [1800, -3000], [1800, -5600]], 7, 6, earth, 'daming', 'med', 0);
  X.box(2750, 0, -3500, 120, 15, 70, mat('#c8b18a', {tex: 'blocks', rep: 3}), 'daming', 'high'); Y2.hall(2750, -3510, 15, 70, 30, 14, '#b8452f', '#3f4a4a', 'daming', 'med', 0, 0);
  for (const sx of [-1, 1]) { const r = new T.Mesh(new T.BoxGeometry(10, 1, 110), mat('#c8b18a')); r.position.set(2750 + sx * 20, 7.5, -3410); r.rotation.x = Math.atan2(15, 110); add(r, 'daming', 'high'); }
  Y2.pagoda(1300, 4000, 7, 25, 9, '#d9c39a', '#b59b72', 'goose', 'high'); Y2.pagoda(500, 1000, 13, 11, 3.4, '#d9c39a', '#b59b72', 'smallgoose', 'high');
  for (const sx of [-1, 1]) { const cx = sx * 2700, cz = 900; X.wallPoly([[cx - 500, cz - 500], [cx + 500, cz - 500], [cx + 500, cz + 500], [cx - 500, cz + 500], [cx - 500, cz - 500]], 4, 3, earth, 'market', 'med', 0);
    const S = []; for (let x = -470; x < 470; x += 30) for (let z = -470; z < 470; z += 30) if (rnd() < 0.6) S.push([cx + x, cz + z, 14, 10, 4, 0, 0.4]); X.houses(S, '#c9a66b', '#6b5a4a', 'hip', 'market', 'low', 'wood'); }
  const WB = new T.BoxGeometry(1, 1, 1); WB.translate(0, 0.5, 0); const WM = [], H = [];
  const xs = [-4860, -3900, -2950, -2000, -1400, -700, 0, 700, 1400, 2000, 2950, 3900, 4860], zs = [0, 600, 1200, 1800, 2400, 3000, 3600, 4200, 4800, 5650];
  const zs2 = [-3000, -2400, -1800, -1200, -600, 0];
  for (let i = 0; i < xs.length - 1; i++) for (const Z of [zs, zs2]) for (let j = 0; j < Z.length - 1; j++) { const x0 = xs[i] + 20, x1 = xs[i + 1] - 20, z0 = Z[j] + 20, z1 = Z[j + 1] - 20, mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
    if (Z === zs2 && Math.abs(mx) < 1400) continue; if ((Math.abs(Math.abs(mx) - 2700) < 400 && Math.abs(mz - 900) < 400) || (Math.abs(mx) < 80)) continue;
    for (const [x, z, w, d] of [[mx, z0, x1 - x0, 3], [mx, z1, x1 - x0, 3], [x0, mz, 3, z1 - z0], [x1, mz, 3, z1 - z0]]) { X.o.position.set(x, 0, z); X.o.rotation.set(0, 0, 0); X.o.scale.set(w, 3.5, d); X.o.updateMatrix(); WM.push(X.o.matrix.clone()); }
    for (let n = 0; n < 9; n++) H.push([x0 + 40 + rnd() * (x1 - x0 - 80), z0 + 40 + rnd() * (z1 - z0 - 80), 24 + rnd() * 16, 16 + rnd() * 10, 5 + rnd() * 3, 0, 0.42]); }
  instanced(WB, mat('#bfa57c', {tex: 'blocks', rep: 1}), WM, 'ward', 'high'); X.o.scale.set(1, 1, 1);
  X.houses(H, '#d6c4a0', '#4a4a4a', 'hip', 'house', 'low', 'wood');
  [[0, 1500], [4, 1505], [1300, 3920], [2750, -3300], [-2700, 900], [-2690, 910]].forEach(([x, z], i) => person(x, z, i));
}

// search (built-in data; works offline)
const INDEX = [...DATA.map((d, i) => ({k: 'h' + i, d, label: d.name, sub: TYPES[d.t].one + ' · ' + span(d.a, d.b)})),
  ...ROUTES.map((d, i) => ({k: 'r' + i, d, label: d.name, sub: 'Trade route · ' + span(d.a, d.b)})),
  ...DEEPSITES.map((d, i) => ({k: 'd' + i, d, label: d.name, sub: 'Deep time · ' + fmtMaTxt(d.a)})),
  ...GTS.map((g, i) => ({k: 'g' + i, label: g[0], sub: `Geological period · ${fmtMaTxt(g[1])}`})),
  ...SCENEITEMS.map((d, i) => ({k: 'S' + i, d, label: d.name, sub: '3D reconstruction · ' + SCENES[d.scene].when + ' · 3D'})),
  ...DEEPGLOBAL.map((d, i) => ({k: 'G' + i, d, label: d.name, sub: 'Deep time · ' + fmtMaTxt(d.a)}))];
const norm = t => t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function runSearch() { const q = norm(document.getElementById('searchIn').value.trim()); const out = document.getElementById('searchOut');
  if (!q) { const sv = loadSaved(); out.innerHTML = (sv.length ? '<p><strong>Saved moments</strong></p>' + sv.map((m, i) => `<div style="display:flex;gap:6px"><button data-sv="${i}" style="flex:1">${esc(m.label)}</button><button data-del="${i}" aria-label="Remove saved moment">×</button></div>`).join('') : '')
    + '<p class="meta">Try \u201cRoman\u201d, \u201cSilk\u201d, \u201cJurassic\u201d, \u201c3D\u201d or \u201cNewton\u201d. Save moments from the card under the time bar.</p>'; return; }
  const res = INDEX.filter(e => norm(e.label + ' ' + e.sub).includes(q) || (e.d && e.d.note && norm(e.d.note).includes(q))).slice(0, 25);
  out.innerHTML = res.length ? res.map(e => `<button data-k="${e.k}"><span>${esc(e.label)}<br><span class="meta" style="margin:0">${esc(e.sub)}</span></span></button>`).join('') : '<p class="meta">No match in the built-in data.</p>'; }
document.getElementById('searchIn').addEventListener('input', runSearch);
document.getElementById('searchOut').addEventListener('click', e => { const sv = e.target.closest('[data-sv]'), dl = e.target.closest('[data-del]');
  if (dl) { const a = loadSaved(); a.splice(+dl.dataset.del, 1); storeSaved(a); return runSearch(); }
  if (sv) { closeS('searchSheet'); return restoreMoment(loadSaved()[+sv.dataset.sv]); }
  const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k, i = +k.slice(1);
  closeS('searchSheet');
  if (k[0] === 'h') { if (st.mode !== 'h') setMode('h'); const d = DATA[i]; setYear(d.a); flyTo([d.lon, d.lat]); showItem(d); }
  else if (k[0] === 'r') { if (st.mode !== 'h') setMode('h'); const d = ROUTES[i]; st.show.r = true; setYear(Math.round((d.a + d.b) / 2)); flyTo(d.pts[Math.floor(d.pts.length / 2)]); showItem(d); }
  else if (k[0] === 'd') { if (st.mode !== 'd') setMode('d'); const d = DEEPSITES[i]; setMa(d.a); flyTo([d.lon, d.lat]); showItem(d); }
  else if (k[0] === 'g') { if (st.mode !== 'd') setMode('d'); const g = GTS[i]; setMa((g[1] + g[2]) / 2); showMoment(); }
  else if (k[0] === 'S') { openScene(SCENEITEMS[i].scene); }
  else if (k[0] === 'G') { if (st.mode !== 'd') setMode('d'); setMa(DEEPGLOBAL[i].a); showMoment(); } });
document.getElementById('searchBtn').addEventListener('click', () => { openS('searchSheet'); runSearch(); document.getElementById('searchIn').focus(); });
// mode switch
function setMode(m) { stopPlay(); st.mode = m; document.getElementById('modeH').setAttribute('aria-pressed', m === 'h'); document.getElementById('modeD').setAttribute('aria-pressed', m === 'd');
  document.querySelectorAll('[data-step]').forEach(b => { const k = +b.dataset.step, u = m === 'd' ? 'million years' : 'years'; b.setAttribute('aria-label', `${k < 0 ? 'Back' : 'Forward'} ${Math.abs(k)} ${Math.abs(k) === 1 ? u.replace('years', 'year') : u}`); });
  ['info', 'moment'].forEach(closeS); ticks(); refreshTime(); size(); save(); }
document.getElementById('modeH').addEventListener('click', () => setMode('h'));
document.getElementById('modeD').addEventListener('click', () => setMode('d'));

// ---------- globe interaction ----------
const ptrs = new Map(); let downAt = null, moved = 0, pinch0 = null, vel = [0, 0], lastT = 0;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 1) { downAt = [e.clientX, e.clientY]; moved = 0; vel = [0, 0]; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: st.zoom}; } });
cv.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2 && pinch0) { const [a, b] = [...ptrs.values()]; st.zoom = clampZ(pinch0.z * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch0.d); moved = 99; dirty = true; return; }
  const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy);
  if (moved > 4) { dragging = true; cv.classList.add('drag'); spin(dx, dy); vel = [dx, dy]; lastT = performance.now(); } });
const up = e => { if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch0 = null;
  if (ptrs.size === 0) { cv.classList.remove('drag');
    if (moved <= 4 && downAt) tap(downAt[0], downAt[1]);
    else if (performance.now() - lastT < 60) coast();
    dragging = false; dirty = true; } };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function spin(dx, dy) { const s = 0.25 / st.zoom; st.rot[0] += dx * s; st.rot[1] = Math.max(-89, Math.min(89, st.rot[1] - dy * s)); dirty = true; }
function coast() { let [vx, vy] = vel; const step = () => { if (dragging || Math.hypot(vx, vy) < 0.3) return; spin(vx, vy); vx *= 0.92; vy *= 0.92; requestAnimationFrame(step); }; if (!matchMedia('(prefers-reduced-motion: reduce)').matches) step(); }
const clampZ = z => Math.max(0.7, Math.min(12, z));
cv.addEventListener('wheel', e => { e.preventDefault(); st.zoom = clampZ(st.zoom * Math.exp(-e.deltaY * 0.0015)); dirty = true; }, {passive: false});
function tap(x, y) {
  let best = null, bd = 22; for (const h of hits) { const d = Math.hypot(h.x - x, h.y - y); if (d < bd) { bd = d; best = h.d; } }
  if (best) return showItem(best);
  for (const h of routeHits) { const d = Math.hypot(h.x - x, h.y - y); if (d < 14) return showItem(h.d); }
  const ll = proj.invert([x, y]); if (!ll || !visible(ll)) { closeS('info'); return; }
  if (st.show.borders && borders) { for (let i = borders.features.length - 1; i >= 0; i--) { const f = borders.features[i]; try { if (d3.geoContains(f, ll)) return showPoly(f.properties, ll); } catch (e) {} } }
  showPlace(ll);
}
function flyTo(ll) { const from = st.rot.slice(), to = [-ll[0], -ll[1], 0], t0 = performance.now(), dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 900;
  if (to[0] - from[0] > 180) to[0] -= 360; if (from[0] - to[0] > 180) to[0] += 360;
  const i = e => from.map((v, j) => v + (to[j] - v) * e); const step = now => { const t = Math.min(1, (now - t0) / dur), e = t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2; st.rot = i(e); dirty = true; if (t < 1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
document.getElementById('homeBtn').addEventListener('click', () => { st.zoom = 1; flyTo([-10, 35]); });

// ---------- keyboard & gamepad (Mac, Ayn Thor) ----------
addEventListener('keydown', e => { if (S3.open) { if (e.key === 'Escape') closeScene(); return; } if (e.target.matches('input,select')) return;
  const k = e.key, m = e.shiftKey ? 10 : 1;
  if (k === 'ArrowRight') step(m); else if (k === 'ArrowLeft') step(-m);
  else if (k === ']') step(100 * m); else if (k === '[') step(-100 * m); else if (k === 'd' || k === 'D') setMode(st.mode === 'd' ? 'h' : 'd');
  else if (k === ' ') { e.preventDefault(); playBtn.click(); }
  else if (k === '+' || k === '=') { st.zoom = clampZ(st.zoom * 1.25); dirty = true; } else if (k === '-') { st.zoom = clampZ(st.zoom / 1.25); dirty = true; }
  else if (k === '/') { e.preventDefault(); document.getElementById('searchBtn').click(); } else if (k === 'l' || k === 'L') document.getElementById('layersBtn').click(); else if (k === 'h' || k === 'H') document.getElementById('homeBtn').click();
  else if (k === 'Escape') document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); else return; });
const step = k => st.mode === 'd' ? setMa(st.ma - k) : setYear(st.year + k);
const padPrev = {}; let padHold = 0;
function pollPad() { const pads = navigator.getGamepads ? navigator.getGamepads() : []; for (const p of pads) { if (!p) continue;
  const pr = i => p.buttons[i] && p.buttons[i].pressed, edge = i => { const now = pr(i), was = padPrev[i]; padPrev[i] = now; return now && !was; };
  const ax = p.axes[0] || 0, ay = p.axes[1] || 0; if (Math.abs(ax) > .15 || Math.abs(ay) > .15) spin(ax * 6, ay * 6);
  const zy = p.axes[3] || 0; if (Math.abs(zy) > .2) { st.zoom = clampZ(st.zoom * (1 - zy * 0.03)); dirty = true; }
  if (edge(15)) step(1); if (edge(14)) step(-1);
  if (edge(5)) step(100); if (edge(4)) step(-100);
  if (edge(7)) step(1000); if (edge(6)) step(-1000); if (edge(2)) setMode(st.mode === 'd' ? 'h' : 'd');
  if (edge(0)) playBtn.click(); if (edge(3)) document.getElementById('layersBtn').click();
  if (pr(15) || pr(14)) { if (++padHold > 20 && padHold % 3 === 0) step(pr(15) ? 10 : -10); } else padHold = 0; } }

// ---------- go ----------
addEventListener('resize', () => { size(); ticks(); });
document.getElementById('s3back').addEventListener('click', closeScene);
document.getElementById('s3x').addEventListener('click', () => document.getElementById('s3panel').classList.remove('open'));
document.getElementById('s3srcBtn').addEventListener('click', showSources);
document.getElementById('s3ev').addEventListener('click', toggleEvidence);
document.getElementById('s3compass').addEventListener('click', () => { if (S3.r) faceNorth(); });
document.getElementById('btnJump').addEventListener('pointerdown', e => { e.preventDefault(); P3.jump = true; });
document.getElementById('btnExam').addEventListener('click', () => examine());
document.getElementById('s3views').addEventListener('click', e => { if (!window.THREE || !S3.r) return; const v = e.target.closest('[data-view]');
  if (v) return setView(v.dataset.view); if (e.target.closest('#s3walk')) return toggleWalk(); if (e.target.closest('#s3play')) return togglePlay();
  if (e.target.closest('#s3sticksBtn')) sticksOn(document.getElementById('sticks').hidden); });
document.getElementById('s3presets').addEventListener('click', e => { const b = e.target.closest('[data-preset]'); if (!b || !S3.r) return; const p = S3.def.presets[+b.dataset.preset];
  setDecl(p.decl, true); S3.hour = sunHourFor(p); if (S3.plume) S3.plume.visible = !!p.plume; setSun(); setView(p.view); });
document.querySelectorAll('[data-decl]').forEach(b => b.addEventListener('click', () => setDecl(+b.dataset.decl)));
document.getElementById('s3hour').addEventListener('input', e => { S3.hour = +e.target.value; setSun(); });
size(); setMode(st.mode); flyTo([-2, 48]); loop();
}
